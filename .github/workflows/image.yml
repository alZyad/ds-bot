name: image

# Pushing to `deploy` is the deploy button: it builds the image and publishes it
# to ghcr.io, where the Oracle box pulls it from. `main` stays a plain code
# branch, so merging something does not ship it — you have to say so.
on:
  push:
    branches: [deploy]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ghcr.io only accepts lowercase image names, and the owner here is
      # `alZyad`, so `github.repository` cannot be used verbatim.
      - name: Work out the image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # qemu gives the runner (x86_64) the ability to build the arm64 half.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 for the AMD instance we run on today, arm64 so an Ampere box is a
      # `docker pull` away rather than a rebuild. The gha cache matters: the
      # arm64 leg is emulated, and without it every push pays for ffmpeg and
      # pip from scratch.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
