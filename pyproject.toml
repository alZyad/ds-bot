[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Optional[...] is kept in the slash-command signatures: that is the form
# discord.py's own documentation and transformer resolution use.
ignore = ["UP045"]
